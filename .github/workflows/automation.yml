name: Automation

on:
  schedule:
    - cron: "*/15 * * * *" # orders + tracking, every 15 minutes
    - cron: "17 */6 * * *" # catalog, prices and stock, every 6 hours
  workflow_dispatch:
    inputs:
      job:
        description: "What to run"
        type: choice
        options: [orders, products]
        default: orders

permissions:
  contents: write
  issues: write
  actions: write

# One run at a time so an order can never be sent to TopDawg twice.
concurrency:
  group: automation
  cancel-in-progress: false

jobs:
  run:
    # Stays off until the TopDawg variables are set (automation/GUIDE-PREMIER.md, step 4).
    if: vars.TOPDAWG_API_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Self-test
        working-directory: automation
        run: npm test

      - name: Run
        working-directory: automation
        run: node src/run.js "${{ inputs.job || (github.event.schedule == '17 */6 * * *' && 'products' || 'orders') }}"
        env:
          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
          EBAY_SANDBOX: ${{ vars.EBAY_SANDBOX || 'false' }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
          EBAY_FULFILLMENT_POLICY_ID: ${{ secrets.EBAY_FULFILLMENT_POLICY_ID }}
          EBAY_PAYMENT_POLICY_ID: ${{ secrets.EBAY_PAYMENT_POLICY_ID }}
          EBAY_RETURN_POLICY_ID: ${{ secrets.EBAY_RETURN_POLICY_ID }}
          TOPDAWG_API_KEY: ${{ secrets.TOPDAWG_API_KEY }}
          TOPDAWG_API_URL: ${{ vars.TOPDAWG_API_URL }}
          TOPDAWG_PRODUCTS_PATH: ${{ vars.TOPDAWG_PRODUCTS_PATH }}
          TOPDAWG_CREATE_ORDER_PATH: ${{ vars.TOPDAWG_CREATE_ORDER_PATH }}
          TOPDAWG_ORDER_PATH: ${{ vars.TOPDAWG_ORDER_PATH }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Save the memory (which orders were sent, which items are listed) even if the run failed halfway.
      - name: Save state
        if: always()
        run: |
          git config user.name "honey-mommy-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/state site/products.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          site_changed=$(git diff --cached --name-only | grep -c '^site/' || true)
          git commit -m "Automation: update state [skip ci]"
          git push
          if [ "$site_changed" -gt 0 ]; then gh workflow run pages.yml --ref "$GITHUB_REF_NAME"; fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
